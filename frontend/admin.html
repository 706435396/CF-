<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台管理 · VAULT 密匣</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
      <span class="logo-en">VAULT</span><span class="logo-cn">密匣 · 管理</span>
    </a>
    <nav class="nav-links"><a href="index.html">返回档案馆</a></nav>
  </div>
</header>

<main class="container admin-wrap">
  <div id="login">
    <div class="panel">
      <h2>🔐 后台登录</h2>
      <div class="field"><label>管理密码</label><input id="pwd" type="password" placeholder="ADMIN_PASSWORD"></div>
      <button class="btn btn-block" onclick="login()">登录</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <div id="dashboard" style="display:none">
    <div class="stat-grid" id="stats"></div>
    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('products',this)">商品管理</button>
        <button class="tab" onclick="switchTab('orders',this)">订单管理</button>
        <button class="tab" onclick="switchTab('add',this)">添加商品</button>
      </div>
    </div>

    <div id="tab-products">
      <div id="productList">加载中…</div>
    </div>
    <div id="tab-orders" style="display:none">
      <div id="orderList">加载中…</div>
    </div>
    <div id="tab-add" style="display:none">
      <div class="panel" style="max-width:none">
        <h2 id="formTitle">添加商品</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div class="field"><label>标识 slug（英文，唯一）</label><input id="f_slug" placeholder="my-novel"></div>
          <div class="field"><label>书名</label><input id="f_title"></div>
          <div class="field"><label>作者</label><input id="f_author" value="佚名"></div>
          <div class="field"><label>分类</label><input id="f_category" value="都市"></div>
          <div class="field"><label>售价（元）</label><input id="f_price" type="number" step="0.01" value="9.9"></div>
          <div class="field"><label>划线价（元）</label><input id="f_original" type="number" step="0.01" value="0"></div>
          <div class="field"><label>格式</label><select id="f_format"><option>txt</option><option>epub</option><option>md</option><option>pdf</option></select></div>
          <div class="field"><label>状态</label><select id="f_status"><option value="on">上架</option><option value="off">下架</option></select></div>
          <div class="field" style="grid-column:1/-1"><label>网盘/直链地址（下载发货用）</label><input id="f_drive" placeholder="https://pan.quark.cn/..."></div>
          <div class="field" style="grid-column:1/-1"><label>R2 文件 key（上传后自动填入，也可手填已有文件）</label><input id="f_r2key" placeholder="files/xxxxxxxx.txt"></div>
          <div class="field" style="grid-column:1/-1">
            <label>上传文件到 R2（可多选，Ctrl/Shift 选多个；支持 txt/md/epub/pdf，单个≤100MB）</label>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <input type="file" id="f_file" accept=".txt,.md,.epub,.pdf" multiple style="flex:1;min-width:200px">
              <button type="button" class="btn btn-sm btn-ghost" id="uploadBtn" onclick="uploadFile()">仅传 R2</button>
              <button type="button" class="btn btn-sm" id="batchBtn" onclick="bulkPublish()">一键批量上架</button>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:4px">「仅传 R2」只上传拿 key（自己逐个建商品）；「一键批量上架」自动传 R2 并为每个文件建商品，书名取文件名，价格/分类/作者/状态用上方表单的值。</div>
            <div id="uploadMsg" style="font-size:12px;color:var(--muted);margin-top:6px;white-space:pre-wrap"></div>
          </div>
          <div class="field" style="grid-column:1/-1"><label>封面 URL（可选）</label><input id="f_cover"></div>
          <div class="field" style="grid-column:1/-1"><label>简介</label><textarea id="f_desc" rows="3"></textarea></div>
          <div class="field" style="grid-column:1/-1"><label>正文（在线阅读用，短篇可粘贴全文）</label><textarea id="f_content" rows="5"></textarea></div>
        </div>
        <input type="hidden" id="f_id">
        <button class="btn" onclick="saveProduct()">保存商品</button>
        <button class="btn btn-ghost" onclick="resetForm()">清空</button>
        <div class="err" id="formErr"></div>

        <div id="bulkZone" style="margin-top:22px;border-top:1px solid var(--line,rgba(212,175,106,.25));padding-top:18px">
          <h3 style="font-size:14px;margin:0 0 6px;color:var(--gold-l,#d4af6a)">文件夹批量上架（并发 · 断点续传）</h3>
          <div style="font-size:12px;color:var(--muted,#8b8f9a);line-height:1.7;margin-bottom:12px">
            选一个文件夹（含子目录）→ 自动递归列出所有文件，并发上传到 R2 并逐个建商品。<br>
            书名取文件名，价格/分类/作者/状态用上方表单的值，格式按扩展名。<br>
            中断后重新选同一文件夹继续，已成功的会自动跳过（断点记录存在本机浏览器）；换浏览器或清缓存会丢失断点。
          </div>
          <input type="file" id="f_dir" webkitdirectory directory multiple style="display:none" onchange="onDirSelected(event)">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
            <button type="button" class="btn btn-sm" onclick="document.getElementById('f_dir').click()">选择文件夹</button>
            <span id="dirInfo" style="font-size:12px;color:var(--muted,#8b8f9a)">未选择文件夹</span>
          </div>
          <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12px">
            <label style="display:flex;gap:6px;align-items:center">并发数 <input id="bulkConc" type="number" min="1" max="8" value="4" style="width:56px"></label>
            <button type="button" class="btn btn-sm btn-ghost" onclick="clearBulkDone()">清除断点记录</button>
            <span id="doneInfo" style="color:var(--muted,#8b8f9a)"></span>
          </div>
          <button type="button" class="btn" id="bulkStartBtn" onclick="startFolderBulk()">开始批量上架</button>
          <div style="background:rgba(255,255,255,.1);height:8px;border-radius:4px;overflow:hidden;margin:14px 0 8px">
            <div id="bulkBar" style="height:100%;width:0%;background:#d4af6a;transition:width .2s"></div>
          </div>
          <div id="bulkProgress" style="font-size:12px;color:var(--muted,#8b8f9a);margin-bottom:8px">就绪</div>
          <div id="bulkLog" style="font-size:12px;line-height:1.7;max-height:260px;overflow:auto;white-space:pre-wrap;color:var(--muted,#8b8f9a)"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer><span class="foot-brand">VAULT</span> · 私密内容自动解锁系统</footer>

<script src="assets/config.js"></script>
<script>
let TOKEN = sessionStorage.getItem('admin_token') || '';
if (TOKEN) showDash();

function authHeaders(){ return { 'Authorization': 'Bearer ' + TOKEN }; }

async function login() {
  const pwd = document.getElementById('pwd').value;
  const r = await api('/api/admin/login', { method:'POST', body: JSON.stringify({ password: pwd }) }).catch(()=>({}));
  if (!r.ok) { document.getElementById('loginErr').textContent = r.error || '登录失败'; return; }
  TOKEN = r.token; sessionStorage.setItem('admin_token', TOKEN); showDash();
}
function showDash() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadStats(); loadProducts(); loadOrders();
}
async function apiAdmin(path, opts={}) {
  opts.headers = { ...authHeaders(), ...(opts.headers||{}) };
  return api(path, opts);
}
async function loadStats() {
  const r = await apiAdmin('/api/admin/stats').catch(()=>({}));
  if (r.ok) document.getElementById('stats').innerHTML = [
    ['商品数', r.products], ['订单数', r.orders], ['已支付', r.paid], ['待支付', r.pending], ['销售额', fmtPrice(r.revenue)]
  ].map(([label,num])=>`<div class="stat"><div class="num">${num}</div><div class="label">${label}</div></div>`).join('');
}
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active');
  ['products','orders','add'].forEach(t=>document.getElementById('tab-'+t).style.display = t===tab?'block':'none');
}
async function loadProducts() {
  const r = await apiAdmin('/api/admin/products').catch(()=>({}));
  if (!r.ok) { document.getElementById('productList').innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  if (!r.list.length) { document.getElementById('productList').innerHTML = '<div class="notice">暂无商品，请点“添加商品”或使用批量脚本导入。</div>'; return; }
  const code = p => 'NO.' + String(p.id).padStart(5,'0');
  document.getElementById('productList').innerHTML = `<div class="notice">前台已全面脱敏：访客仅能看到档案编号（由 ID 派生）、分类与价格，书名/作者/封面/正文均不会出现在任何公开接口，付款验证通过后才揭示。</div>` +
    `<table><thead><tr><th>档案编号</th><th>名称（仅管理员可见）</th><th>分类</th><th>价格</th><th>销量</th><th>状态</th><th>操作</th></tr></thead><tbody>` +
    r.list.map(p=>`<tr>
      <td style="font-family:var(--mono);color:var(--gold-l)">${code(p)}</td>
      <td>${esc(p.title)}</td>
      <td>${esc(p.category)}</td><td>${fmtPrice(p.price)}</td><td>${p.sales||0}</td>
      <td><span class="status ${p.status==='on'?'paid':'expired'}">${p.status==='on'?'上架':'下架'}</span></td>
      <td><button class="btn btn-sm" onclick="editProduct(${p.id})">编辑</button>
          <button class="btn btn-sm btn-ghost" onclick="delProduct(${p.id})">删</button></td>
    </tr>`).join('') + '</tbody></table>';
}
async function loadOrders() {
  const r = await apiAdmin('/api/admin/orders').catch(()=>({}));
  if (!r.ok || !r.list.length) { document.getElementById('orderList').innerHTML = '<div class="notice">暂无订单</div>'; return; }
  document.getElementById('orderList').innerHTML = `<table><thead><tr><th>订单号</th><th>商品</th><th>金额</th><th>状态</th><th>邮箱</th><th>时间</th><th>操作</th></tr></thead><tbody>` +
    r.list.map(o=>`<tr>
      <td style="font-size:11px">${esc(o.order_no)}</td><td>${esc(o.product_title)}</td><td>${fmtPrice(o.amount)}</td>
      <td><span class="status ${o.status==='paid'?'paid':o.status==='pending'?'pending':'expired'}">${o.status}</span></td>
      <td>${esc(o.email||'-')}</td><td>${new Date(o.created_at).toLocaleDateString()}</td>
      <td>${o.status==='paid'?`<button class="btn btn-sm btn-ghost" onclick="resend('${esc(o.order_no)}')">补发</button>`:'-'}</td>
    </tr>`).join('') + '</tbody></table>';
}
async function editProduct(id) {
  const r = await apiAdmin('/api/admin/products/'+id).catch(()=>({}));
  if (!r.ok) return;
  const p = r.product;
  document.getElementById('f_id').value = p.id;
  document.getElementById('f_slug').value = p.slug; document.getElementById('f_title').value = p.title;
  document.getElementById('f_author').value = p.author; document.getElementById('f_category').value = p.category;
  document.getElementById('f_price').value = p.price/100; document.getElementById('f_original').value = (p.original_price||0)/100;
  document.getElementById('f_format').value = p.file_format; document.getElementById('f_status').value = p.status;
  document.getElementById('f_drive').value = p.drive_url||''; document.getElementById('f_r2key').value = p.r2_key||'';
  document.getElementById('f_cover').value = p.cover_url||''; document.getElementById('f_desc').value = p.description||'';
  document.getElementById('f_content').value = p.content||'';
  document.getElementById('formTitle').textContent = '编辑商品 #' + p.id;
  switchTab('add', document.querySelectorAll('.tab')[2]);
  window.scrollTo(0, document.getElementById('tab-add').offsetTop);
}
function resetForm(){ document.getElementById('tab-add').querySelectorAll('input,textarea').forEach(e=>{if(e.type!=='hidden')e.value=''}); document.getElementById('f_id').value=''; document.getElementById('formTitle').textContent='添加商品'; }
async function saveProduct() {
  const p = {
    slug: document.getElementById('f_slug').value.trim(), title: document.getElementById('f_title').value.trim(),
    author: document.getElementById('f_author').value.trim(), category: document.getElementById('f_category').value.trim(),
    price: Math.round(parseFloat(document.getElementById('f_price').value||0)*100),
    original_price: Math.round(parseFloat(document.getElementById('f_original').value||0)*100),
    file_format: document.getElementById('f_format').value, status: document.getElementById('f_status').value,
    drive_url: document.getElementById('f_drive').value.trim(), r2_key: document.getElementById('f_r2key').value.trim(),
    cover_url: document.getElementById('f_cover').value.trim(), description: document.getElementById('f_desc').value,
    content: document.getElementById('f_content').value,
  };
  if (!p.slug || !p.title) { document.getElementById('formErr').textContent = 'slug 和书名必填'; return; }
  const id = document.getElementById('f_id').value;
  const r = await apiAdmin(id? '/api/admin/products/'+id : '/api/admin/products', {
    method: id?'PUT':'POST', body: JSON.stringify(p)
  }).catch(()=>({}));
  if (!r.ok) { document.getElementById('formErr').textContent = r.error||'保存失败'; return; }
  alert('保存成功'); resetForm(); loadProducts(); loadStats();
}
async function uploadFile() {
  const fi = document.getElementById('f_file');
  const msg = document.getElementById('uploadMsg');
  const btn = document.getElementById('uploadBtn');
  const files = Array.from(fi.files || []);
  if (!files.length) { msg.textContent = '请先选择文件（可按 Ctrl / Shift 多选）'; return; }
  // 前置校验：扩展名 + 大小
  const valid = [], skipped = [];
  for (const f of files) {
    const ext = f.name.split('.').pop().toLowerCase();
    if (!['txt','md','epub','pdf'].includes(ext)) { skipped.push(`${f.name}（格式不支持）`); continue; }
    if (f.size > 100 * 1024 * 1024) { skipped.push(`${f.name}（超过 100MB）`); continue; }
    valid.push(f);
  }
  if (!valid.length) { msg.textContent = '没有可上传的文件。仅支持 txt/md/epub/pdf，单个≤100MB'; return; }
  const base = (window.API_BASE || '').replace(/\/$/, '');
  const oks = [], fails = [];
  btn.disabled = true;
  try {
    for (let i = 0; i < valid.length; i++) {
      const file = valid[i];
      msg.textContent = `上传中 ${i+1}/${valid.length}：${file.name}`;
      try {
        const resp = await fetch(`${base}/api/admin/upload?name=${encodeURIComponent(file.name)}`, {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/octet-stream' },
          body: await file.arrayBuffer(),
        });
        const r = await resp.json();
        if (r.ok) oks.push({ name: file.name, key: r.key, size: r.size });
        else fails.push(`${file.name}：${r.error || resp.status}`);
      } catch (e) {
        fails.push(`${file.name}：${e.message}`);
      }
    }
  } finally {
    btn.disabled = false;
  }
  // 回填策略：单个直接填 key；多个把最后一个填入表单，并在消息里列出全部 key 供复制
  const lines = [`完成：成功 ${oks.length}/${valid.length}`];
  if (oks.length === 1) {
    document.getElementById('f_r2key').value = oks[0].key;
    lines.push(`✓ ${oks[0].name}（${(oks[0].size/1024).toFixed(1)} KB）`);
    lines.push(`已填入 R2 key：${oks[0].key}`);
  } else if (oks.length > 1) {
    document.getElementById('f_r2key').value = oks[oks.length - 1].key;
    lines.push('已上传文件与 key（每个文件需分别建商品，填入对应 key）：');
    oks.forEach((o, idx) => lines.push(`  ${idx+1}. ${o.name} → ${o.key}`));
    lines.push(`（最后一个 key 已自动填入上方输入框）`);
  }
  if (skipped.length) lines.push(`跳过 ${skipped.length} 个：${skipped.join('、')}`);
  if (fails.length) lines.push(`失败 ${fails.length} 个：${fails.join('、')}`);
  msg.textContent = lines.join('\n');
}

// 一键批量上架：传 R2 → 自动为每个文件建商品（书名取文件名，统一用表单的价格/分类/作者/状态）
async function bulkPublish() {
  const fi = document.getElementById('f_file');
  const msg = document.getElementById('uploadMsg');
  const btn = document.getElementById('batchBtn');
  const files = Array.from(fi.files || []);
  if (!files.length) { msg.textContent = '请先选择文件（可按 Ctrl / Shift 多选）'; return; }

  // 统一字段（取自表单）
  const category = document.getElementById('f_category').value.trim() || '其他';
  const author = document.getElementById('f_author').value.trim() || '佚名';
  const price = Math.round(parseFloat(document.getElementById('f_price').value || 0) * 100);
  const original = Math.round(parseFloat(document.getElementById('f_original').value || 0) * 100);
  const status = document.getElementById('f_status').value;
  const base = (window.API_BASE || '').replace(/\/$/, '');

  // 校验扩展名 + 大小
  const valid = [], skipped = [];
  for (const f of files) {
    const ext = f.name.split('.').pop().toLowerCase();
    if (!['txt','md','epub','pdf'].includes(ext)) { skipped.push(`${f.name}（格式不支持）`); continue; }
    if (f.size > 100 * 1024 * 1024) { skipped.push(`${f.name}（超过 100MB）`); continue; }
    valid.push(f);
  }
  if (!valid.length) { msg.textContent = '没有可上架的文件。仅支持 txt/md/epub/pdf，单个≤100MB'; return; }

  // 拉取已有 slug，避免唯一约束冲突（断点友好）
  let used = new Set();
  try {
    const ex = await apiAdmin('/api/admin/products').catch(()=>({}));
    if (ex.ok && ex.list) used = new Set(ex.list.map(x => x.slug));
  } catch (e) { /* 拉不到就靠随机后缀兜底 */ }
  const mkSlug = (name) => {
    let s = name.replace(/\.[^.]+$/, '').replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'item';
    let c = s, n = 2;
    while (used.has(c)) { c = s + '-' + n; n++; }
    used.add(c);
    return c;
  };

  const oks = [], fails = [];
  btn.disabled = true;
  try {
    for (let i = 0; i < valid.length; i++) {
      const f = valid[i];
      const ext = f.name.split('.').pop().toLowerCase();
      msg.textContent = `批量上架 ${i+1}/${valid.length}：${f.name}`;
      try {
        // 1) 传 R2
        const resp = await fetch(`${base}/api/admin/upload?name=${encodeURIComponent(f.name)}`, {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/octet-stream' },
          body: await f.arrayBuffer(),
        });
        const up = await resp.json();
        if (!up.ok || !up.key) throw new Error(up.error || resp.status);
        // 2) 建商品绑定 key
        const title = f.name.replace(/\.[^.]+$/, '');
        const payload = {
          slug: mkSlug(f.name), title, author, category,
          price, original_price: original, file_format: ext,
          file_name: f.name, file_size: f.size, r2_key: up.key,
          content: '', description: `《${title}》 私密档案，付款后自动发货。`, status,
        };
        const created = await apiAdmin('/api/admin/products', { method: 'POST', body: JSON.stringify(payload) });
        if (!created.ok) throw new Error(created.error || '建商品失败');
        oks.push(`${title}（${up.key}）`);
      } catch (e) {
        fails.push(`${f.name}：${e.message}`);
      }
    }
  } finally {
    btn.disabled = false;
  }

  const lines = [`批量上架完成：成功 ${oks.length}/${valid.length}`];
  if (oks.length) lines.push('✓ ' + oks.join('\n✓ '));
  if (skipped.length) lines.push(`跳过 ${skipped.length} 个：${skipped.join('、')}`);
  if (fails.length) lines.push(`失败 ${fails.length} 个：${fails.join('、')}`);
  msg.textContent = lines.join('\n');
  if (oks.length) { loadProducts(); loadStats(); }
}

/* ============ 文件夹批量上架：并发 + 断点续传 + 进度 ============ */
const BULK_DONE_KEY = 'vault_bulk_done_v1';
let bulkFiles = [];
let bulkRunning = false;

function bulkDone() {
  try { return JSON.parse(localStorage.getItem(BULK_DONE_KEY) || '{}'); }
  catch (e) { return {}; }
}
function fileFingerprint(f) {
  // 相对路径 + 大小 + 修改时间，三者一致视为同一文件（断点依据）
  return (f.webkitRelativePath || f.name) + '|' + f.size + '|' + Math.floor(f.lastModified || 0);
}
function refreshDoneInfo() {
  const n = Object.keys(bulkDone()).length;
  const el = document.getElementById('doneInfo');
  if (el) el.textContent = n ? `断点记录：已成功 ${n} 个` : '断点记录：无';
}
function clearBulkDone() {
  if (!confirm('确认清除本机断点记录？清除后重新上架会重复创建已上传的商品。')) return;
  localStorage.removeItem(BULK_DONE_KEY);
  refreshDoneInfo();
  document.getElementById('bulkLog').textContent = '断点记录已清除。';
}
function onDirSelected(event) {
  const all = Array.from(event.target.files || []);
  bulkFiles = all.filter(f => {
    const ext = f.name.split('.').pop().toLowerCase();
    return ['txt','md','epub','pdf'].includes(ext) && f.size <= 100 * 1024 * 1024;
  });
  const skipped = all.length - bulkFiles.length;
  const done = bulkDone();
  const pending = bulkFiles.filter(f => !done[fileFingerprint(f)]);
  let info = `选中 ${bulkFiles.length} 个合规文件`;
  if (skipped) info += `（跳过 ${skipped} 个：格式/大小不符）`;
  if (pending.length !== bulkFiles.length) info += `，其中 ${pending.length} 个待上架（其余已有断点）`;
  document.getElementById('dirInfo').textContent = info;
  document.getElementById('bulkProgress').textContent = '已选择文件夹，点「开始批量上架」。';
  document.getElementById('bulkBar').style.width = '0%';
  refreshDoneInfo();
}
function bulkLog(line) {
  const el = document.getElementById('bulkLog');
  el.textContent += line + '\n';
  el.scrollTop = el.scrollHeight;
}
async function bulkTask(file, ctx) {
  const fp = fileFingerprint(file);
  if (ctx.done[fp]) return { status: 'skip', name: file.name };
  const ext = file.name.split('.').pop().toLowerCase();
  let lastErr = '';
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      // 1) 传 R2
      const resp = await fetch(`${ctx.base}/api/admin/upload?name=${encodeURIComponent(file.name)}`, {
        method: 'POST',
        headers: { ...authHeaders(), 'Content-Type': 'application/octet-stream' },
        body: await file.arrayBuffer(),
      });
      const up = await resp.json();
      if (!up.ok || !up.key) throw new Error(up.error || resp.status);
      // 2) 建商品
      const title = (file.webkitRelativePath || file.name).replace(/\.[^.]+$/, '').split('/').pop();
      const payload = {
        slug: ctx.mkSlug(file.webkitRelativePath || file.name), title,
        author: ctx.author, category: ctx.category, price: ctx.price,
        original_price: ctx.original, file_format: ext,
        file_name: file.name, file_size: file.size, r2_key: up.key,
        content: '', description: `《${title}》 私密档案，付款后自动发货。`, status: ctx.status,
      };
      const created = await apiAdmin('/api/admin/products', { method: 'POST', body: JSON.stringify(payload) });
      if (!created.ok) throw new Error(created.error || '建商品失败');
      // 3) 记录断点
      ctx.done[fp] = { key: up.key, title, at: Date.now() };
      localStorage.setItem(ctx.doneKey, JSON.stringify(ctx.done));
      return { status: 'ok', name: file.name, key: up.key };
    } catch (e) {
      lastErr = e.message;
      if (attempt < 3) await new Promise(r => setTimeout(r, 500 * attempt));
    }
  }
  return { status: 'fail', name: file.name, error: lastErr };
}
async function startFolderBulk() {
  if (bulkRunning) { alert('正在批量上架中，请等待完成。'); return; }
  if (!bulkFiles.length) { alert('请先选择文件夹。'); return; }
  const conc = Math.max(1, Math.min(8, parseInt(document.getElementById('bulkConc').value, 10) || 4));
  const base = (window.API_BASE || '').replace(/\/$/, '');
  const category = document.getElementById('f_category').value.trim() || '其他';
  const author = document.getElementById('f_author').value.trim() || '佚名';
  const price = Math.round(parseFloat(document.getElementById('f_price').value || 0) * 100);
  const original = Math.round(parseFloat(document.getElementById('f_original').value || 0) * 100);
  const status = document.getElementById('f_status').value;

  // 已有 slug 去重
  let used = new Set();
  const ex = await apiAdmin('/api/admin/products').catch(()=>({}));
  if (ex.ok && ex.list) used = new Set(ex.list.map(x => x.slug));
  const mkSlug = (p) => {
    let s = p.replace(/\.[^.]+$/, '').replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'item';
    let c = s, n = 2;
    while (used.has(c)) { c = s + '-' + n; n++; }
    used.add(c);
    return c;
  };

  const ctx = {
    base, category, author, price, original, status, mkSlug,
    doneKey: BULK_DONE_KEY, done: bulkDone(),
  };
  const targets = bulkFiles.filter(f => !ctx.done[fileFingerprint(f)]);
  const total = targets.length;
  const doneAtStart = bulkFiles.length - total;
  document.getElementById('bulkLog').textContent = '';
  if (!total) {
    document.getElementById('bulkProgress').textContent = `全部 ${bulkFiles.length} 个文件都已有断点记录，无需处理。`;
    return;
  }

  bulkRunning = true;
  document.getElementById('bulkStartBtn').disabled = true;
  let finished = 0, oks = 0, fails = 0;
  const updateProgress = () => {
    const pct = Math.round(finished / total * 100);
    document.getElementById('bulkBar').style.width = pct + '%';
    document.getElementById('bulkProgress').textContent = `处理中 ${finished}/${total}（成功 ${oks}，失败 ${fails}，已跳过断点 ${doneAtStart}）`;
  };
  updateProgress();

  // 简单并发池
  let idx = 0;
  const worker = async () => {
    while (idx < targets.length) {
      const f = targets[idx++];
      const r = await bulkTask(f, ctx);
      finished++;
      if (r.status === 'ok') { oks++; bulkLog(`✓ [${finished}/${total}] ${r.name} → ${r.key}`); }
      else if (r.status === 'fail') { fails++; bulkLog(`✗ [${finished}/${total}] ${r.name}：${r.error}（已重试3次）`); }
      updateProgress();
    }
  };
  await Promise.all(Array.from({ length: Math.min(conc, total) }, worker));

  bulkRunning = false;
  document.getElementById('bulkStartBtn').disabled = false;
  document.getElementById('bulkProgress').textContent = `完成：成功 ${oks}，失败 ${fails}，跳过断点 ${doneAtStart}，共 ${bulkFiles.length} 个。`;
  refreshDoneInfo();
  if (oks) { loadProducts(); loadStats(); }
}
async function delProduct(id) {
  if (!confirm('确认删除商品 #'+id+'？')) return;
  await apiAdmin('/api/admin/products/'+id, { method:'DELETE' }); loadProducts(); loadStats();
}
async function resend(no) {
  const r = await apiAdmin('/api/admin/resend/'+encodeURIComponent(no), { method:'POST' }).catch(()=>({}));
  alert(r.ok ? '已重新发货' : '补发失败：'+(r.error||''));
}
