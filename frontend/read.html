<body>
<header class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>

<main class="container">
  <div id="reader" class="reader"><div class="loading">验证专属链接…</div></div>
</main>

<footer><span class="foot-brand">VAULT</span> · 专属阅读链接，请勿转发 · Powered by Cloudflare</footer>

<script src="assets/config.js"></script>
<script>
const token = qs('token');
async function load() {
  if (!token) { document.getElementById('reader').innerHTML = '<div class="err">缺少访问令牌</div>'; return; }
  const r = await api('/api/read/' + encodeURIComponent(token)).catch(() => ({}));
  if (!r.ok) { document.getElementById('reader').innerHTML = `<div class="err">${esc(r.error||'无法访问')}</div>`; return; }
  document.title = r.title + ' · VAULT 密匣';
  document.getElementById('reader').innerHTML = `
    <h1>${esc(r.title)}</h1>
    <div class="author">${esc(r.author||'')} · 专属解锁内容</div>
    <div class="content">${esc(r.content)}</div>`;
}
load();
</script>
</body>
</html>
